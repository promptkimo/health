<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康紀錄儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 15px; background-color: #f0f2f5; color: #333; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; color: #00B900; margin-bottom: 15px; font-size: 22px; }
        
        /* 頁籤導覽列樣式 */
        .tabs { display: flex; background: white; border-radius: 10px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tab-btn { flex: 1; padding: 15px 0; border: none; background: white; color: #888; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: #00B900; color: white; }
        
        /* 頁籤內容區塊 */
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 卡片與表單樣式 */
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
        .card-title { font-weight: bold; font-size: 18px; margin-bottom: 15px; color: #444; border-left: 5px solid #00B900; padding-left: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #666; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; background-color: #fafafa; }
        input:focus { border-color: #00B900; outline: none; background-color: #fff; }
        
        .bp-group { display: flex; align-items: center; gap: 10px; }
        .bp-slash { font-size: 24px; color: #ccc; font-weight: 300; }
        
        .btn-main { width: 100%; padding: 16px; background-color: #00B900; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-main:active { background-color: #009900; }
        .btn-main:disabled { background-color: #ccc; }
        
        .range-btns { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .btn-range { padding: 6px 16px; border: 1px solid #00B900; background: white; color: #00B900; border-radius: 20px; font-size: 13px; cursor: pointer; }
        .btn-range.active { background: #00B900; color: white; }
        
        canvas { background: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; max-height: 250px; width: 100%; }
        #status { text-align: center; font-size: 14px; margin-top: 10px; height: 20px; }
        #profile { text-align: center; font-size: 14px; margin-bottom: 15px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h2>健康紀錄卡</h2>
    <div id="profile">正在載入 LINE 資訊...</div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('input')">📝 記錄資料</button>
        <button class="tab-btn" onclick="switchTab('chart')">📊 查看圖表</button>
    </div>

    <div id="tab-input" class="tab-content active">
        <div class="card">
            <div class="card-title">血壓紀錄</div>
            <div class="bp-group">
                <div style="flex: 1;">
                    <label>收縮壓 (高壓)</label>
                    <input type="number" id="systolic" inputmode="numeric" placeholder="mmHg">
                </div>
                <div class="bp-slash">/</div>
                <div style="flex: 1;">
                    <label>舒張壓 (低壓)</label>
                    <input type="number" id="diastolic" inputmode="numeric" placeholder="mmHg">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">血糖紀錄</div>
            <div style="margin-bottom: 15px;">
                <label>血糖數值 (mg/dL)</label>
                <input type="number" id="sugar" inputmode="numeric" placeholder="請輸入數值">
            </div>
            <div>
                <label>量測狀態</label>
                <select id="sugarType">
                    <option value="空腹">空腹血糖</option>
                    <option value="飯後">飯後兩小時</option>
                    <option value="隨機">隨機 / 其他</option>
                </select>
            </div>
        </div>

        <button class="btn-main" id="submitBtn" onclick="submitData()" disabled>儲存本次紀錄</button>
        <div id="status"></div>
    </div>

    <div id="tab-chart" class="tab-content">
        <div class="range-btns">
            <button class="btn-range active" onclick="changeRange(7, this)">最近7天</button>
            <button class="btn-range" onclick="changeRange(14, this)">14天</button>
            <button class="btn-range" onclick="changeRange(30, this)">30天</button>
        </div>
        <div class="card">
            <div class="card-title" style="border-left-color: #ff4d4d;">血壓趨勢</div>
            <canvas id="bpChart"></canvas>
        </div>
        <div class="card">
            <div class="card-title" style="border-left-color: #FFD700;">血糖紀錄</div>
            <canvas id="sugarChart"></canvas>
        </div>
    </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    const LIFF_ID = "2009700439-YQBjAyVe";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxmlF2zQzzFuF-Kl0oGbaM4d7M7LD8kA5I-0CflLHQpxnY6UQy5MjSAWlDUId_Pd-aZ/exec";
    
    let userUID = "";
    let bpChartInstance = null;
    let sugarChartInstance = null;
    let isChartLoaded = false; // 避免重複載入圖表

    async function init() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) { liff.login(); return; }
            const profile = await liff.getProfile();
            userUID = profile.userId;
            document.getElementById("profile").innerText = `使用者：${profile.displayName}`;
            document.getElementById("submitBtn").disabled = false;
        } catch (e) { console.error(e); }
    }

    // 切換頁籤功能
    function switchTab(tabName) {
        // 移除所有 active 狀態
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        // 根據選擇加上 active
        if (tabName === 'input') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-input').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-chart').classList.add('active');
            // 切換到圖表時才向後台請求資料
            changeRange(7, document.querySelector('.btn-range.active') || document.querySelectorAll('.btn-range')[0]);
        }
    }

    function submitData() {
        const systolic = document.getElementById("systolic").value;
        const diastolic = document.getElementById("diastolic").value;
        const sugar = document.getElementById("sugar").value;
        const sugarType = document.getElementById("sugarType").value;

        if (!systolic && !diastolic && !sugar) {
            alert("請至少填寫血壓或血糖其中一項！");
            return;
        }

        const btn = document.getElementById("submitBtn");
        const status = document.getElementById("status");
        btn.disabled = true;
        status.innerText = "正在同步至雲端...";

        const payload = {
            uid: userUID,
            systolic: systolic,
            diastolic: diastolic,
            sugar: sugar,
            sugarType: sugarType,
            note: ""
        };

        fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(r => r.json())
        .then(res => {
            status.innerHTML = "<span style='color:green; font-weight:bold;'>✅ 資料已成功儲存</span>";
            document.getElementById("systolic").value = "";
            document.getElementById("diastolic").value = "";
            document.getElementById("sugar").value = "";
            isChartLoaded = false; // 標記圖表需要更新
            setTimeout(() => { status.innerText = ""; }, 3000);
        })
        .catch(e => {
            status.innerHTML = "<span style='color:red;'>❌ 儲存失敗，請檢查網路</span>";
            console.error(e);
        })
        .finally(() => btn.disabled = false);
    }

    function changeRange(days, btn) {
        document.querySelectorAll('.btn-range').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // 顯示載入中
        if(bpChartInstance) bpChartInstance.destroy();
        if(sugarChartInstance) sugarChartInstance.destroy();
        
        fetch(`${GAS_URL}?uid=${userUID}&days=${days}`)
        .then(r => r.json())
        .then(data => renderCharts(data));
    }

    function renderCharts(data) {
        const labels = data.map(d => d.date);
        const sysData = data.map(d => d.systolic);
        const diaData = data.map(d => d.diastolic);
        const sugarData = data.map(d => d.sugar);

        // 1. 血壓圖表
        bpChartInstance = new Chart(document.getElementById('bpChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: '收縮壓', data: sysData, borderColor: '#ff4d4d', backgroundColor: '#ff4d4d', tension: 0.3, fill: false },
                    { label: '舒張壓', data: diaData, borderColor: '#4d79ff', backgroundColor: '#4d79ff', tension: 0.3, fill: false }
                ]
            },
            options: { 
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } },
                scales: { y: { beginAtZero: false } }
            }
        });

        // 2. 血糖圖表
        sugarChartInstance = new Chart(document.getElementById('sugarChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{ 
                    label: '數值', 
                    data: sugarData, 
                    backgroundColor: data.map(d => d.sugarType === '空腹' ? '#FFD700' : (d.sugarType === '飯後' ? '#00B900' : '#999'))
                }]
            },
            options: { 
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } } 
            }
        });
    }

    window.onload = init;
</script>
</body>
</html>
